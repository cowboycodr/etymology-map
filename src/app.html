<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />

    <!-- Primary -->
    <title>Etymology Map</title>
    <meta name="description" content="Explore the origins of English words through interactive etymology trees and graphs. Trace roots across Proto-Indo-European, Latin, Greek, Old French, and more." />
    <meta name="keywords" content="etymology, word origins, Proto-Indo-European, Latin, Greek, linguistics, word history, English roots" />
    <meta name="author" content="Etymology Map" />

    <!-- Canonical base -->
    <link rel="canonical" href="https://map.kian.im" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Etymology Map" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://map.kian.im" />
    <meta property="og:title" content="Etymology Map" />
    <meta property="og:description" content="Explore the origins of English words through interactive etymology trees and graphs. Trace roots across Proto-Indo-European, Latin, Greek, Old French, and more." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Etymology Map" />
    <meta name="twitter:description" content="Explore the origins of English words through interactive etymology trees and graphs. Trace roots across Proto-Indo-European, Latin, Greek, Old French, and more." />

    <!-- Theme -->
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
