<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etymology Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:    #1e1e2e;
      --bg-surface: #181825;
      --bg-hover:   #313244;
      --border:     #313244;
      --tree-line:  #313244;

      --text-primary:   #cdd6f4;
      --text-secondary: #bac2de;
      --text-muted:     #6c7086;

      --accent:     #89b4fa;
      --accent-bg:  #1a2a3d;

      /* language tag colours */
      --c-pie:        #f38ba8; --c-pie-bg:        #3d1a1f;
      --c-latin:      #fab387; --c-latin-bg:      #3d2a1a;
      --c-greek:      #a6e3a1; --c-greek-bg:      #1a3020;
      --c-english:    #89b4fa; --c-english-bg:    #1a2a3d;
      --c-norse:      #89dceb; --c-norse-bg:      #1a3038;
      --c-slavic:     #94e2d5; --c-slavic-bg:     #1a3330;
      --c-iranian:    #f9e2af; --c-iranian-bg:    #3d3010;
      --c-phoenician: #f9e2af; --c-phoenician-bg: #3d2f10;
      --c-other:      #cba6f7; --c-other-bg:      #2a1a3d;

      --row-h: 26px;
      --guide-w: 20px;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ───────────────────────────────────────────── */

    .sidebar {
      width: 196px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .word-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .word-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      margin: 1px 4px;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.08s, color 0.08s;
      user-select: none;
    }
    .word-item:hover  { background: var(--bg-hover); color: var(--text-primary); }
    .word-item.active { background: var(--accent-bg); color: var(--accent); }

    .word-item .dot {
      font-size: 9px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .word-item.active .dot { color: var(--accent); }

    /* ── MAIN ──────────────────────────────────────────────── */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      padding: 16px 22px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left { min-width: 0; }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      font-style: italic;
    }

    .header-controls {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .btn {
      font-family: inherit;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: color 0.1s, border-color 0.1s;
    }
    .btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

    .tree-area {
      flex: 1;
      overflow: auto;
      padding: 12px 24px 24px 12px;
    }

    .empty-state {
      color: var(--text-muted);
      padding: 48px 24px;
      font-size: 12px;
    }

    /* ── TREE ──────────────────────────────────────────────── */

    .node-row {
      display: flex;
      align-items: center;
      height: var(--row-h);
      border-radius: 3px;
      cursor: pointer;
      padding-right: 10px;
      white-space: nowrap;
      transition: background 0.07s;
    }
    .node-row:hover { background: var(--bg-hover); }

    /* guide strip (tree lines) */
    .guides {
      display: flex;
      align-items: stretch;
      height: var(--row-h);
      flex-shrink: 0;
    }

    .guide {
      width: var(--guide-w);
      height: var(--row-h);
      position: relative;
      flex-shrink: 0;
    }

    /* pass-through: full vertical line */
    .guide.pass::before {
      content: '';
      position: absolute;
      left: 9px; top: 0; bottom: 0;
      width: 1px;
      background: var(--tree-line);
    }

    /* tee (├─): full vertical + horizontal at midpoint */
    .guide.tee::before {
      content: '';
      position: absolute;
      left: 9px; top: 0; bottom: 0;
      width: 1px;
      background: var(--tree-line);
    }
    .guide.tee::after {
      content: '';
      position: absolute;
      left: 9px;
      top: calc(var(--row-h) / 2);
      right: 0;
      height: 1px;
      background: var(--tree-line);
    }

    /* elbow (└─): top-half vertical + horizontal at midpoint */
    .guide.elbow::before {
      content: '';
      position: absolute;
      left: 9px; top: 0;
      height: calc(var(--row-h) / 2);
      width: 1px;
      background: var(--tree-line);
    }
    .guide.elbow::after {
      content: '';
      position: absolute;
      left: 9px;
      top: calc(var(--row-h) / 2);
      right: 0;
      height: 1px;
      background: var(--tree-line);
    }

    /* chevron (hidden — collapse removed) */
    .chevron {
      display: none;
      width: 16px;
      height: var(--row-h);
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 9px;
      transition: transform 0.14s;
    }
    .chevron.open { transform: rotate(90deg); }
    .chevron.leaf { opacity: 0; pointer-events: none; }

    /* label */
    .node-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 2px;
    }

    .node-word    { font-weight: 500; color: var(--text-primary); }
    .node-date    { font-size: 11px; color: var(--text-muted); opacity: 0.7; }
    .node-meaning { font-size: 11.5px; color: var(--text-muted); font-style: italic; }

    .lang-tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 500;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    /* .node-children.collapsed removed — collapse functionality removed */

    /* vim cursor */
    .node-row.selected {
      background: var(--bg-hover);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    /* hint bar */
    .hint-bar {
      flex-shrink: 0;
      padding: 5px 22px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .hint-bar span { font-size: 10px; color: var(--text-muted); }
    .hk {
      display: inline-block;
      font-size: 10px;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border: 1px solid #45475a;
      border-radius: 3px;
      padding: 0 4px;
      line-height: 1.5;
      font-family: inherit;
    }

    /* language colours */
    .lang-pie        { background: var(--c-pie-bg);        color: var(--c-pie);        }
    .lang-latin      { background: var(--c-latin-bg);      color: var(--c-latin);      }
    .lang-greek      { background: var(--c-greek-bg);      color: var(--c-greek);      }
    .lang-english    { background: var(--c-english-bg);    color: var(--c-english);    }
    .lang-norse      { background: var(--c-norse-bg);      color: var(--c-norse);      }
    .lang-slavic     { background: var(--c-slavic-bg);     color: var(--c-slavic);     }
    .lang-iranian    { background: var(--c-iranian-bg);    color: var(--c-iranian);    }
    .lang-phoenician { background: var(--c-phoenician-bg); color: var(--c-phoenician); }
    .lang-other      { background: var(--c-other-bg);      color: var(--c-other);      }

    /* clickable word labels */
    .node-word { cursor: pointer; transition: color 0.1s; }
    .node-word:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

    /* highlighted node on root pages */
    .node-row.root-hl { background: rgba(137, 180, 250, 0.07); }
    .node-row.root-hl .node-word { color: var(--accent); }

    /* search button */
    .btn-search {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 130px;
      color: var(--text-muted);
      justify-content: space-between;
    }
    .btn-search:hover { color: var(--text-secondary); border-color: #6c7086; }

    /* ── ROOT PAGE ───────────────────────────────────────────── */

    .root-page { padding: 2px 0 24px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      font-size: 11px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 0 12px;
      transition: color 0.1s;
    }
    .back-btn:hover { color: var(--accent); }

    .root-hero {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .root-hero-word { font-size: 20px; font-weight: 600; color: var(--text-primary); }
    .root-hero-meaning {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 14px;
    }
    .root-found-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .root-section {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .root-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.1s;
      user-select: none;
    }
    .root-section-title:hover { opacity: 0.75; }
    .root-section-arrow { color: var(--text-muted); font-weight: 400; margin-left: auto; font-size: 11px; }
    .root-section-tree { padding: 6px 0; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── CMD PALETTE ─────────────────────────────────────────── */

    .cmd-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14vh;
    }
    .cmd-overlay.hidden { display: none; }

    .cmd-modal {
      width: 580px;
      max-width: calc(100vw - 40px);
      background: var(--bg-surface);
      border: 1px solid #45475a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.7);
    }

    .cmd-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .cmd-search-icon { color: var(--text-muted); font-size: 15px; flex-shrink: 0; }
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
    }
    .cmd-input::placeholder { color: var(--text-muted); }
    .cmd-esc-key {
      font-family: inherit;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border: 1px solid #45475a;
      border-radius: 3px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .cmd-results {
      max-height: 380px;
      overflow-y: auto;
      padding: 6px 0 8px;
    }
    .cmd-hint {
      padding: 20px 18px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .cmd-result {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 14px;
      margin: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.07s;
    }
    .cmd-result:hover, .cmd-result.focused { background: var(--bg-hover); }

    .cmd-result-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cmd-match-word { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .cmd-match-word mark {
      background: rgba(137, 180, 250, 0.2);
      color: var(--accent);
      border-radius: 2px;
      font-weight: inherit;
    }
    .cmd-in-tag {
      font-size: 10px;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: auto;
    }
    .cmd-path {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cmd-path-arrow { opacity: 0.4; margin: 0 3px; }
    .cmd-path-match { color: var(--text-secondary); font-weight: 500; }
    .cmd-meaning {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cmd-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 20px 4px;
    }
  </style>
</head>
<body>

<!-- Command palette -->
<div id="cmdPalette" class="cmd-overlay hidden">
  <div class="cmd-modal">
    <div class="cmd-search-row">
      <span class="cmd-search-icon">⌕</span>
      <input id="cmdInput" class="cmd-input" placeholder="Search roots, languages, meanings…" autocomplete="off" spellcheck="false" />
      <kbd class="cmd-esc-key">esc</kbd>
    </div>
    <div class="cmd-results" id="cmdResults">
      <div class="cmd-hint">search across all etymology trees</div>
    </div>
  </div>
</div>

<div class="sidebar">
  <div class="word-list" id="wordList"></div>
</div>

<div class="main">
  <div class="main-header">
    <div class="header-left">
      <div class="header-title" id="headerTitle">Select a word</div>
      <div class="header-meta"  id="headerMeta">Choose a word from the sidebar</div>
    </div>
    <div class="header-controls">
      <button class="btn btn-search" onclick="openPalette()">
        <span>⌕ search roots</span><kbd class="hk">⌘K</kbd>
      </button>
    </div>
  </div>
  <div class="tree-area" id="treeArea">
    <div class="empty-state">← select a word to trace its roots</div>
  </div>
  <div class="hint-bar">
    <span><kbd class="hk">⌘K</kbd> search roots</span>
    <span><kbd class="hk">j</kbd><kbd class="hk">k</kbd> navigate</span>
    <span><kbd class="hk">h</kbd><kbd class="hk">l</kbd> parent / child</span>
    <span><kbd class="hk">gg</kbd> top &nbsp;<kbd class="hk">G</kbd> bottom</span>
    <span><kbd class="hk">enter</kbd> open</span>
  </div>
</div>

<script>
let NODES = {};       // id → node object (flat map)
let WORD_IDS = [];    // ordered list of top-level word node IDs
let CONTAINED_IN = {}; // precomputed: nodeId → [wordId, ...]

// ── LANGUAGE → CSS CLASS ────────────────────────────────────────────────────

function langClass(lang) {
  const l = lang.toLowerCase();
  if (l.includes('proto-indo') || l === 'pie') return 'lang-pie';
  if (l.includes('phoenician') || l.includes('semitic')) return 'lang-phoenician';
  if (l.includes('slavic') || l.includes('czech') || l.includes('polish') || l.includes('russian')) return 'lang-slavic';
  if (l.includes('iranian') || l.includes('persian') || l.includes('avestan')) return 'lang-iranian';
  if (l.includes('greek')) return 'lang-greek';
  if (l.includes('latin') || l.includes('italian') || l.includes('french') || l.includes('spanish') || l.includes('portuguese')) return 'lang-latin';
  if (l.includes('english')) return 'lang-english';
  if (l.includes('norse') || l.includes('germanic') || l.includes('german') || l.includes('dutch') || l.includes('nordic') || l.includes('gothic') || l.includes('danish') || l.includes('swedish') || l.includes('icelandic') || l.includes('frisian')) return 'lang-norse';
  return 'lang-other';
}

// ── TREE RENDERER ───────────────────────────────────────────────────────────
// ancestorHasMore[i] = true if the ancestor at that depth still has siblings
// below the current subtree — drives whether to draw a pass-through │ line.

let _id = 0;
let _renderHighlight = null; // set before rendering to highlight a specific node word

function renderNode(node, isLast, ancestorHasMore, isRoot = false) {
  const id = 'n' + (++_id);
  const hasKids = node.roots && node.roots.length > 0;

  // Guide elements (tree branch lines)
  let guidesHTML = '';
  if (!isRoot) {
    for (const hasMore of ancestorHasMore) {
      guidesHTML += `<span class="guide ${hasMore ? 'pass' : ''}"></span>`;
    }
    guidesHTML += `<span class="guide ${isLast ? 'elbow' : 'tee'}"></span>`;
  }

  const lc = langClass(node.lang);
  const hlClass = (_renderHighlight && node._id === _renderHighlight) ? ' root-hl' : '';

  // Recurse: when entering children, track whether the current node
  // itself has siblings below it (= !isLast) as the new ancestor entry.
  let kidsHTML = '';
  if (hasKids) {
    const childAncestors = isRoot ? [] : [...ancestorHasMore, !isLast];
    kidsHTML = node.roots
      .map((child, i) => renderNode(child, i === node.roots.length - 1, childAncestors))
      .join('');
  }

  return `<div class="tree-node" id="${id}">
    <div class="node-row${hlClass}" data-word="${node.word.replace(/"/g,'&quot;')}" onclick="selectRow(this)">
      <div class="guides">${guidesHTML}</div>
      <div class="node-label">
        <span class="node-word"
          data-nav-id="${esc(node._id||'')}"
        >${esc(node.word)}</span>
        ${node.date ? `<span class="node-date">${node.date}</span>` : ''}
        <span class="lang-tag ${lc}">${esc(node.lang)}</span>
        ${node.meaning ? `<span class="node-meaning">"${esc(node.meaning)}"</span>` : ''}
      </div>
    </div>
    ${hasKids ? `<div class="node-children" id="${id}-c">${kidsHTML}</div>` : ''}
  </div>`;
}


// ── RELATIONAL HELPERS ───────────────────────────────────────────────────────

// Expand flat node references into a nested tree for rendering.
// Uses depth limit (not visited set) so shared PIE roots can appear
// under multiple ancestors (it's a DAG, fine to expand into a tree).
function buildTree(id, depth = 0) {
  if (depth > 25) return null;
  const n = NODES[id];
  if (!n) return null;
  return {
    ...n,
    _id: id,
    roots: (n.roots || []).map(rid => buildTree(rid, depth + 1)).filter(Boolean)
  };
}

// Precompute reverse index: nodeId → [wordId, ...]
// Run once after NODES and WORD_IDS are loaded.
function buildContainedIn() {
  const map = {};
  function walk(wid, nodeId) {
    if (!map[nodeId]) map[nodeId] = [];
    if (map[nodeId].includes(wid)) return; // already visited via this word
    map[nodeId].push(wid);
    for (const rid of (NODES[nodeId]?.roots || [])) walk(wid, rid);
  }
  for (const wid of WORD_IDS) walk(wid, wid);
  return map;
}

// ── SEARCH ENGINE ───────────────────────────────────────────────────────────

// Aliases so users can type "nordic", "pie", "greek", "viking", etc.
const LANG_ALIASES = {
  // PIE
  'pie':                 ['proto-indo-european'],
  'proto indo european': ['proto-indo-european'],
  'root':                ['proto-indo-european'],
  'roots':               ['proto-indo-european'],
  'pib':                 ['proto-indo-european'], // common typo
  // Greek
  'greek':               ['greek'],
  'hellenic':            ['greek'],
  'hellenistic':         ['greek'],
  'attic':               ['greek'],
  // Latin & Romance
  'latin':               ['latin'],
  'romance':             ['latin', 'italian', 'french', 'spanish', 'portuguese'],
  'classical':           ['latin', 'classical'],
  'roman':               ['latin'],
  // Norse / Germanic
  'norse':               ['norse'],
  'nordic':              ['norse'],
  'viking':              ['norse'],
  'germanic':            ['germanic', 'norse', 'german'],
  'german':              ['german', 'germanic'],
  'dutch':               ['dutch', 'germanic'],
  'scandinavian':        ['norse'],
  // Slavic
  'slavic':              ['slavic', 'church slavonic', 'czech'],
  'czech':               ['czech'],
  'russian':             ['russian', 'slavic'],
  // Iranian / Persian
  'iranian':             ['iranian'],
  'persian':             ['persian', 'iranian', 'avestan'],
  'avestan':             ['avestan', 'iranian'],
  'zoroastrian':         ['avestan', 'iranian'],
  // Semitic / Phoenician
  'phoenician':          ['phoenician'],
  'semitic':             ['phoenician', 'semitic', 'hebrew', 'aramaic'],
  'hebrew':              ['hebrew', 'phoenician'],
  // English branches
  'english':             ['english'],
  'old english':         ['old english', 'english'],
  'middle english':      ['middle english', 'english'],
  'anglo':               ['english', 'anglo'],
  // French
  'french':              ['french'],
  'old french':          ['old french', 'french'],
  // Italian
  'italian':             ['italian'],
};

// Normalise a string: lowercase, strip PIE special chars, strip diacritics
function norm(s) {
  return String(s)
    .toLowerCase()
    .replace(/[*]/g, '')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, d => String(d.codePointAt(0) - 0x2080))
    .replace(/[ʰʷʸʲ]/g, '')
    .replace(/[-–—]/g, ' ')
    .replace(/[()[\]]/g, '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // strip diacritics
    .replace(/\s+/g, ' ')
    .trim();
}

// Levenshtein distance, bails early past `cap`
function editDist(a, b, cap = 3) {
  if (Math.abs(a.length - b.length) > cap) return cap + 1;
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = a[i - 1] === b[j - 1] ? row[j - 1] : 1 + Math.min(row[j - 1], row[j], prev);
      row[j - 1] = prev;
      prev = tmp;
    }
    row[b.length] = prev;
  }
  return row[b.length];
}

// Score a single normalised token against a normalised target string.
// Returns 0 if no match at all.
function scoreToken(rawToken, rawTarget) {
  const t = norm(rawToken);
  const v = norm(rawTarget);
  if (!t || !v) return 0;

  // Exact field match
  if (v === t) return 100;
  // Field starts with token
  if (v.startsWith(t)) return 80;
  // Field contains token
  if (v.includes(t)) return 60;

  // Check alias expansions
  const aliases = LANG_ALIASES[t] || [];
  for (const alias of aliases) {
    if (v.includes(alias)) return 55;
  }

  // Word-level fuzzy: check each word in the target
  for (const word of v.split(' ')) {
    if (word.length < 3 || t.length < 3) continue;
    const threshold = t.length <= 4 ? 1 : 2;
    const d = editDist(t, word, threshold);
    if (d <= threshold) return 35 - d * 8;
  }

  return 0;
}

// Score every node in NODES against the query (flat iteration — no tree walk).
// Tokens are AND-ed: every token must match at least one field.
function searchAllNodes(query) {
  const q = query.trim();
  if (!q) return [];

  const tokens = q.split(/\s+/).filter(Boolean);
  const results = [];

  for (const [nodeId, node] of Object.entries(NODES)) {
    // Only include nodes reachable from at least one top-level word
    const inWords = CONTAINED_IN[nodeId];
    if (!inWords || !inWords.length) continue;

    let total = 0;
    for (const token of tokens) {
      const best = Math.max(
        scoreToken(token, node.word),
        scoreToken(token, node.lang)    * 0.85,
        scoreToken(token, node.meaning) * 0.55,
        scoreToken(token, node.date)    * 0.25,
      );
      if (best === 0) { total = -1; break; } // AND: all tokens must hit
      total += best;
    }

    if (total > 0) results.push({ nodeId, node, inWords, score: total });
  }

  return results.sort((a, b) => b.score - a.score);
}

// HTML escape
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Highlight all token matches inside text, returning safe HTML
function hlMatch(text, query) {
  if (!query) return esc(text);
  const tokens = query.trim().split(/\s+/).filter(Boolean);

  // Collect all match ranges in the original text
  const lower = text.toLowerCase();
  const ranges = [];
  for (const token of tokens) {
    const t = norm(token);
    if (!t) continue;
    let i = 0;
    while ((i = lower.indexOf(t, i)) !== -1) { ranges.push({ s: i, e: i + t.length }); i++; }
  }
  if (!ranges.length) return esc(text);

  // Sort & merge overlapping ranges
  ranges.sort((a, b) => a.s - b.s);
  const merged = [];
  for (const r of ranges) {
    if (merged.length && r.s <= merged.at(-1).e) merged.at(-1).e = Math.max(merged.at(-1).e, r.e);
    else merged.push({ ...r });
  }

  let out = '', pos = 0;
  for (const { s, e } of merged) {
    out += esc(text.slice(pos, s)) + `<mark>${esc(text.slice(s, e))}</mark>`;
    pos = e;
  }
  return out + esc(text.slice(pos));
}

// ── CMD PALETTE ─────────────────────────────────────────────────────────────

let _paletteOpen = false;
let _searchResults = [];
let _focusedResult = -1;

function openPalette() {
  document.getElementById('cmdPalette').classList.remove('hidden');
  const inp = document.getElementById('cmdInput');
  inp.value = '';
  inp.focus();
  renderPaletteResults('');
  _paletteOpen = true;
  _focusedResult = -1;
}

function closePalette() {
  document.getElementById('cmdPalette').classList.add('hidden');
  _paletteOpen = false;
}


function renderPaletteResults(query) {
  const el = document.getElementById('cmdResults');
  _searchResults = searchAllNodes(query);
  _focusedResult = -1;

  if (!query.trim()) {
    el.innerHTML = '<div class="cmd-hint">search across all etymology trees</div>';
    return;
  }
  if (!_searchResults.length) {
    el.innerHTML = '<div class="cmd-hint">no results</div>';
    return;
  }

  el.innerHTML = _searchResults.map((r, i) => {
    const lc = langClass(r.node.lang);
    const isTopLevel = WORD_IDS.includes(r.nodeId);
    // Show which top-level words contain this node (up to 3)
    const inLabels = r.inWords.slice(0, 3).map(wid => esc(NODES[wid]?.word || wid)).join(', ')
      + (r.inWords.length > 3 ? ` +${r.inWords.length - 3}` : '');

    return `<div class="cmd-result" data-idx="${i}" onmousedown="pickResult(${i})">
      <div class="cmd-result-top">
        <span class="cmd-match-word">${hlMatch(r.node.word, query)}</span>
        <span class="lang-tag ${lc}" style="font-size:10px;padding:1px 5px">${esc(r.node.lang)}</span>
        ${!isTopLevel && r.inWords.length ? `<span class="cmd-in-tag">in ${inLabels}</span>` : ''}
      </div>
      ${r.node.meaning ? `<div class="cmd-meaning">${esc(r.node.meaning)}</div>` : ''}
    </div>`;
  }).join('');
}

function movePaletteFocus(dir) {
  const els = document.querySelectorAll('.cmd-result');
  if (!els.length) return;
  _focusedResult = Math.max(0, Math.min(_focusedResult + dir, els.length - 1));
  els.forEach((el, i) => el.classList.toggle('focused', i === _focusedResult));
  els[_focusedResult]?.scrollIntoView({ block: 'nearest' });
}

function pickResult(i) {
  const r = _searchResults[i];
  if (!r) return;
  closePalette();
  if (WORD_IDS.includes(r.nodeId)) {
    selectWord(r.nodeId);
    // Expand ancestors and focus the matched node
    for (const span of document.querySelectorAll('.node-word[data-nav-id]')) {
      if (span.dataset.navId === r.nodeId) {
        const row = span.closest('.node-row');
        if (!row) break;
        let el = row.parentElement;
        while (el) {
          if (el.classList.contains('node-children') && el.classList.contains('collapsed')) {
            el.classList.remove('collapsed');
            el.parentElement?.querySelector(':scope > .node-row .chevron')?.classList.add('open');
          }
          el = el.parentElement;
        }
        selectRow(row);
        break;
      }
    }
  } else {
    showRootPage(r.nodeId);
  }
}

// Palette keyboard events (cmd+k, esc, arrows, enter)
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    _paletteOpen ? closePalette() : openPalette();
    return;
  }
  if (!_paletteOpen) return;
  if (e.key === 'Escape')     { e.preventDefault(); e.stopPropagation(); closePalette(); }
  else if (e.key === 'ArrowDown' || (e.key === 'j' && e.target.tagName !== 'INPUT')) { e.preventDefault(); movePaletteFocus(+1); }
  else if (e.key === 'ArrowUp'   || (e.key === 'k' && e.target.tagName !== 'INPUT')) { e.preventDefault(); movePaletteFocus(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (_focusedResult >= 0) { pickResult(_focusedResult); }
    else if (_searchResults.length > 0) { movePaletteFocus(+1); document.getElementById('cmdInput').blur(); }
  }
}, true); // capture phase so it runs before the vim handler

document.getElementById('cmdPalette').addEventListener('mousedown', e => {
  if (e.target === e.currentTarget) closePalette();
});
document.getElementById('cmdInput').addEventListener('input', e => renderPaletteResults(e.target.value));

// ── VIM NAVIGATION ──────────────────────────────────────────────────────────

let _cursor = null; // currently selected .node-row element

function selectRow(row) {
  if (_cursor) _cursor.classList.remove('selected');
  _cursor = row || null;
  if (_cursor) {
    _cursor.classList.add('selected');
    _cursor.scrollIntoView({ block: 'nearest' });
  }
}

function visibleRows() {
  return [...document.querySelectorAll('.node-row')];
}

function parentRow(row) {
  const nc = row.closest('.tree-node')?.parentElement;
  if (!nc?.classList.contains('node-children')) return null;
  return nc.parentElement?.querySelector(':scope > .node-row') || null;
}

function firstChildRow(row) {
  const id = row.closest('.tree-node')?.id;
  const kids = id ? document.getElementById(id + '-c') : null;
  return kids?.querySelector(':scope > .tree-node > .node-row') || null;
}

let _pendingG = false, _gTimer = null;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey) return;

  const rows = visibleRows();
  const idx  = _cursor ? rows.indexOf(_cursor) : -1;

  switch (e.key) {

    case 'j': case 'ArrowDown':
      e.preventDefault();
      if (!rows.length) break;
      selectRow(rows[idx < 0 ? 0 : Math.min(idx + 1, rows.length - 1)]);
      break;

    case 'k': case 'ArrowUp':
      e.preventDefault();
      if (!rows.length) break;
      selectRow(rows[idx <= 0 ? 0 : idx - 1]);
      break;

    case 'l': case 'ArrowRight':
      e.preventDefault();
      if (_cursor) { const c = firstChildRow(_cursor); if (c) selectRow(c); }
      break;

    case 'h': case 'ArrowLeft':
      e.preventDefault();
      if (_cursor) { const p = parentRow(_cursor); if (p) selectRow(p); }
      break;

    case 'g':
      if (_pendingG) {
        clearTimeout(_gTimer); _pendingG = false;
        if (rows.length) selectRow(rows[0]);
      } else {
        _pendingG = true;
        _gTimer = setTimeout(() => { _pendingG = false; }, 400);
      }
      break;

    case 'G':
      e.preventDefault();
      if (rows.length) selectRow(rows[rows.length - 1]);
      break;

    case 'Enter':
      e.preventDefault();
      if (_cursor) {
        const navId = _cursor.querySelector('.node-word[data-nav-id]')?.dataset.navId;
        if (navId) showRootPage(navId);
      }
      break;

    case 'Escape':
      e.preventDefault();
      goBack();
      break;
  }
});

// ── ROOT PAGE ────────────────────────────────────────────────────────────────

let _history         = [];   // navigation history stack
let _currentView     = null; // { type:'word', key } | { type:'root', nodeId }

function showRootPage(nodeId, pushHistory = true) {
  if (pushHistory && _currentView) _history.push({ ..._currentView });
  _currentView = { type: 'root', nodeId };
  selectRow(null);

  const n = NODES[nodeId];
  if (!n) return;

  // Find all top-level word trees that contain this node
  const hits = CONTAINED_IN[nodeId] || [];

  document.getElementById('headerTitle').textContent = 'Etymology Map';
  document.getElementById('headerMeta').textContent = '';

  // Render each containing word tree with the target node highlighted
  const treeSections = hits.map(wid => {
    const wordNode = NODES[wid];
    _renderHighlight = nodeId;
    _id = 0;
    const treeHTML = renderNode(buildTree(wid), true, [], true);
    _renderHighlight = null;
    return `<div class="root-section">
      <div class="root-section-title" onclick="_history.length=0;_currentView=null;selectWord('${wid}')">
        ${esc(wordNode.word)}
        <span class="root-section-arrow">open word →</span>
      </div>
      <div class="root-section-tree">${treeHTML}</div>
    </div>`;
  }).join('');

  document.getElementById('treeArea').innerHTML = `
    <div class="root-page">
      <button class="back-btn" onclick="goBack()">← back</button>
      <div class="root-hero">
        <span class="root-hero-word">${esc(n.word)}</span>
        <span class="lang-tag ${langClass(n.lang)}">${esc(n.lang)}</span>
      </div>
      ${n.meaning ? `<div class="root-hero-meaning">"${esc(n.meaning)}"</div>` : ''}
      <div class="root-found-label">found in ${hits.length} word ${hits.length === 1 ? 'hierarchy' : 'hierarchies'}</div>
      ${treeSections || '<div class="cmd-hint">no hierarchies found</div>'}
    </div>`;
}

function goBack() {
  const prev = _history.pop();
  if (!prev) return;
  if (prev.type === 'word') selectWord(prev.key, false);
  else showRootPage(prev.nodeId, false);
}

// Click delegation: word labels navigate to root page
document.addEventListener('click', e => {
  const span = e.target.closest('.node-word[data-nav-id]');
  if (!span) return;
  e.stopPropagation();
  showRootPage(span.dataset.navId);
});

// ── WORD SELECTION ──────────────────────────────────────────────────────────

function selectWord(nodeId, pushHistory = true) {
  if (pushHistory && _currentView) _history.push({ ..._currentView });
  _currentView = { type: 'word', key: nodeId };

  document.querySelectorAll('.word-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.word-item[data-key="${nodeId}"]`)?.classList.add('active');

  const w = NODES[nodeId];
  const lc = langClass(w.lang);

  document.getElementById('headerTitle').textContent = 'Etymology Map';
  document.getElementById('headerMeta').textContent = '';

  _id = 0;
  const treeHTML = renderNode(buildTree(nodeId), true, [], true);
  document.getElementById('treeArea').innerHTML = `
    <div class="root-page">
      <div class="root-hero">
        <span class="root-hero-word">${esc(w.word)}</span>
        <span class="lang-tag ${lc}">${esc(w.lang)}</span>
        ${w.date ? `<span class="node-date" style="font-size:12px;opacity:1">${esc(w.date)}</span>` : ''}
      </div>
      ${w.meaning ? `<div class="root-hero-meaning">"${esc(w.meaning)}"</div>` : ''}
      <div style="margin-top:10px">${treeHTML}</div>
    </div>`;
  selectRow(document.querySelector('#treeArea .node-row'));
}

// ── INIT ────────────────────────────────────────────────────────────────────

async function init() {
  const data = await fetch('./words.json').then(r => r.json());
  NODES    = data.nodes;
  WORD_IDS = data.words;
  CONTAINED_IN = buildContainedIn();

  const listEl = document.getElementById('wordList');
  for (const nodeId of WORD_IDS) {
    const n = NODES[nodeId];
    const el = document.createElement('div');
    el.className = 'word-item';
    el.dataset.key = nodeId;
    el.innerHTML = `<span class="dot">◆</span>${esc(n.word)}`;
    el.addEventListener('click', () => {
      _history.length = 0;
      _currentView = null;
      selectWord(nodeId, false);
    });
    listEl.appendChild(el);
  }

  selectWord(WORD_IDS[0], false);
}

init();
</script>
</body>
